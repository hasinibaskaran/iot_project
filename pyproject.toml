[project]
name = "smart-train-sanitation-backend"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "supabase>=2.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.28.0"
]

[project.scripts]
app = "api.main:run_server"

[tool.uv]
package = true

[tool.setuptools]
packages = ["api"]
